[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "first-agent"
version = "1.0.0"
description = "First Agent — local-first agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # ruff 钉版：0.17.3+ 收紧 SIM102 判定，长期未改的 scripts/verify_materialized_tree.py
    # 出现新告警（工具链漂移）。钉回 2026-10 连续绿门的实测版本，证据见
    # docs/handoffs/2026-10-14-task-trust-resume/AUDIT.md 与
    # docs/audits/2026-10-11-product-readiness-independent-audit.md。
    "ruff==0.15.12",
    "setuptools>=68.0",
]
browser = [
    "playwright==1.62.0",
]
skill = [
    "PyYAML>=6,<7",
]
mcp = [
    "mcp==1.28.1",
    "anyio>=4.14.2",
    "jsonschema>=4.23,<5",
]
tui = [
    "textual>=8.2,<9",
]

[project.scripts]
first-agent = "main:main"
first-agent-schedule = "agent.automation.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "first_agent_skill_runner"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".ua", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "scripts", "tests"]
# pytest 配置以仓库根 pytest.ini 为准（testpaths/markers/filterwarnings/addopts）；
# 此处不再重复定义，避免双份配置互相遮蔽。
