# Example: GLM-5 via OpenAI-compatible (DashScope)
# 使用方式：cp config/examples/glm-openai-compatible.config.yaml config/config.yaml
# 然后将 api_key 替换为真实 key
#
# 用户只需配置 enabled/type/model/base_url/api_key。
# request_path 和 auth_scheme 由 adapter 内部决定，不需要用户配置。

provider:
  enabled: true
  type: openai_compatible
  model: glm-5
  base_url: https://coding.dashscope.aliyuncs.com/v1
  api_key: sk-REPLACE_ME
