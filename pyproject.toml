[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "first-agent"
version = "0.10.0"
description = "First Agent — local-first agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
]
anthropic = [
    "anthropic>=0.89.0",
]
all = [
    "pytest>=8.0",
    "ruff>=0.15.0",
    "anthropic>=0.89.0",
]

[project.scripts]
first-agent = "main:main"

[tool.setuptools]
# main.py 在项目根目录，不在 src/ 下
py-modules = ["main", "config"]
packages = ["agent"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_checkpoint_ownership.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = []
