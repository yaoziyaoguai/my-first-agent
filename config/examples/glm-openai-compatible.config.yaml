# Example 3: GLM-5 via OpenAI-compatible (DashScope)
# api_key_env 指向环境变量名，实际 key 值在 .env 中设置（不放在这里）。
# 使用方式：cp config/examples/glm-openai-compatible.config.yaml config/config.yaml
# 然后在 .env 中设置：OPENAI_API_KEY=<your-dashscope-key>

provider:
  enabled: true
  type: openai_compatible
  model: glm-5
  base_url: https://coding.dashscope.aliyuncs.com/v1
  request_path: /v1/chat/completions
  auth_scheme: bearer
  api_key_env: OPENAI_API_KEY
