[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "first-agent"
version = "1.0.0"
description = "First Agent — local-first agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.0",
    "setuptools>=68.0",
]
browser = [
    "playwright==1.62.0",
]
skill = [
    "PyYAML>=6,<7",
]
mcp = [
    "mcp==1.28.1",
    "anyio>=4.14.2",
    "jsonschema>=4.23,<5",
]
tui = [
    "textual>=8.2,<9",
]

[project.scripts]
first-agent = "main:main"
first-agent-schedule = "agent.automation.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".ua", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = []
