[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --color=yes
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    dogfood: automated user-path dogfood regression tests
    materialized_loopback: requires a local listener outside the deny-network test boundary
filterwarnings =
    ignore::DeprecationWarning
