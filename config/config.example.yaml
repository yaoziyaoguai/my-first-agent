# First Agent 统一项目配置参考
#
# 快速开始（推荐）：直接复制对应示例
#   cp config/examples/deepseek-anthropic-compatible.config.yaml config/config.yaml   # DeepSeek
#   cp config/examples/kimi-anthropic-compatible.config.yaml config/config.yaml   # Kimi K2.5
#   cp config/examples/glm-openai-compatible.config.yaml config/config.yaml        # GLM-5
#   cp config/examples/fake.config.yaml config/config.yaml                         # 默认安全路径
#
# API key 安全规则：
#   - 永远不要将真实 API key 写入可提交的 config 文件
#   - 推荐：使用 api_key_env 从环境变量读取 key（适用于可提交的模板/示例）
#   - 也可：inline api_key 写入本地 config（不提交，个人开发使用）
#   - config/config.yaml 已被 .gitignore 忽略（不再被 Git 跟踪），可在本地存放真实 key 而不会被提交
#
# 本文件列出所有可用字段及其说明。

# =============================================================================
# Provider 配置（protocol-centric — see PROVIDER_ABSTRACTION_AUDIT.md）
# =============================================================================
# Provider 抽象以 PROTOCOL 为核心，不是以厂商为核心：
#   - type (protocol): 决定请求/响应适配器（openai/anthropic/fake 路径）
#   - base_url + model: 决定具体 endpoint/vendor（DeepSeek/Kimi/GLM/vLLM/Ollama…）
#   - 能力差异（streaming/tool_calling/usage）是 protocol-path 属性，不是 vendor 属性
#
# 例如：DeepSeek 可通过 anthropic_compatible 或 openai_compatible 两种协议接入；
#       Kimi/Qwen/GLM/vLLM/Ollama 均通过 openai_compatible 接入，只换 base_url+key+model。
#       同一 protocol path 的 maturity 不因 vendor 不同而改变。
#
# enabled:    true=启用真实 LLM / false=本地 fake 安全路径
# type:       protocol: fake | anthropic_native | anthropic_compatible | openai_native | openai_compatible
# model:      模型名（如 deepseek-v4-flash / kimi-k2.5 / glm-5）
# base_url:   endpoint 地址（compatible 模式必填；native 模式不需要）
# api_key_env: 环境变量名，从 process env 读取 API key（推荐用于可提交模板）
# api_key:     inline API key（本地未提交场景可用，简洁直接）
#
# 能力矩阵（由 protocol adapter 决定，非 vendor）：
#   - anthropic_compatible: tool_calling=yes, streaming=yes, usage=yes (L6 path)
#   - openai_compatible:    tool_calling=yes, streaming=fail_closed, usage=yes (L4)
#   - *_native:             factory-wired, 需官方 credential (L2)
#   - fake:                 确定性, 无网络 (L3 test support)
#
# 用户只需配置以上字段。request_path 和 auth_scheme 由 protocol adapter 内部决定。
provider:
  enabled: false
  type: fake
  model: fake-llm
